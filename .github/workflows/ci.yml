name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          TZ: Asia/Ho_Chi_Minh
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      TZ: Asia/Ho_Chi_Minh # cùng múi giờ máy dev: test ngày công/tháng lương phụ thuộc ngày hiện tại
      CSDL_HOST: 127.0.0.1
      CSDL_CONG: 3306
      CSDL_NGUOI_DUNG: root
      CSDL_MAT_KHAU: ''
      CSDL_TEN: quanlydoanhnghiepthongminh
      # Chuỗi giả chỉ dùng cho CI (DB tạm, không có dữ liệu thật)
      JWT_BI_MAT: ci-chuoi-bi-mat-gia-dai-toi-thieu-32-ky-tu-0123456789
      JWT_HET_HAN: 8h
      CORS_NGUON: http://localhost:5173
      AI_SERVICE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run khoiTaoCsdl
      - run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  ai-service:
    name: AI service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
