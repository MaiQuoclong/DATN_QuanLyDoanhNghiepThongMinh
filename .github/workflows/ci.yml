name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          TZ: Asia/Ho_Chi_Minh
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      TZ: Asia/Ho_Chi_Minh # cùng múi giờ máy dev: test ngày công/tháng lương phụ thuộc ngày hiện tại
      CSDL_HOST: 127.0.0.1
      CSDL_CONG: 3306
      CSDL_NGUOI_DUNG: root
      CSDL_MAT_KHAU: ''
      CSDL_TEN: quanlydoanhnghiepthongminh
      # Chuỗi giả chỉ dùng cho CI (DB tạm, không có dữ liệu thật)
      JWT_BI_MAT: ci-chuoi-bi-mat-gia-dai-toi-thieu-32-ky-tu-0123456789
      JWT_HET_HAN: 8h
      CORS_NGUON: http://localhost:5173
      AI_SERVICE_URL: http://localhost:8000
      AI_CSDL_MAT_KHAU: ci-mat-khau-chi-doc-gia # chỉ dùng cho DB tạm của CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run khoiTaoCsdl
      - run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  ai-service:
    name: AI service (pytest)
    runs-on: ubuntu-latest
    # MariaDB thật cho test tích hợp Text-to-SQL (@pytest.mark.csdl): quyền aiReadonly, phạm vi quanLy, max_statement_time
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          TZ: Asia/Ho_Chi_Minh
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: ai-service
    env:
      TZ: Asia/Ho_Chi_Minh
      CSDL_MAT_KHAU_TEST: ci-mat-khau-chi-doc-gia
      CSDL_HOST_TEST: 127.0.0.1
      CSDL_CONG_TEST: 3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Dựng CSDL + tài khoản aiReadonly
        working-directory: backend
        env:
          CSDL_HOST: 127.0.0.1
          CSDL_CONG: 3306
          CSDL_NGUOI_DUNG: root
          CSDL_MAT_KHAU: ''
          CSDL_TEN: quanlydoanhnghiepthongminh
          AI_CSDL_MAT_KHAU: ci-mat-khau-chi-doc-gia
        run: npm ci && npm run khoiTaoCsdl
      # Runner nối vào container qua cổng ánh xạ → MariaDB thấy IP cổng docker (172.x), không phải 127.0.0.1,
      # nên aiReadonly@127.0.0.1 bị "Access denied". Chỉ trong CI: sao chép đúng quyền sang aiReadonly@'%'.
      - name: Cho aiReadonly đăng nhập từ cổng docker (chỉ CI)
        working-directory: .
        run: |
          {
            echo "CREATE USER 'aiReadonly'@'%' IDENTIFIED BY '${CSDL_MAT_KHAU_TEST}';"
            mysql -h 127.0.0.1 -P 3306 -u root -N -e "SHOW GRANTS FOR 'aiReadonly'@'127.0.0.1'" \
              | grep -v '^GRANT USAGE' | sed "s/'aiReadonly'@'127.0.0.1'/'aiReadonly'@'%'/; s/\$/;/"
          } > /tmp/capQuyenCi.sql
          mysql -h 127.0.0.1 -P 3306 -u root < /tmp/capQuyenCi.sql
          mysql -h 127.0.0.1 -P 3306 -u aiReadonly -p"${CSDL_MAT_KHAU_TEST}" -e "SELECT COUNT(*) FROM quanlydoanhnghiepthongminh.phongban"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
